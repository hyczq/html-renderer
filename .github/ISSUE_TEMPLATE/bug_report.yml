name: Bug 报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全漏洞请不要提交公开 Issue，请按 [SECURITY.md](https://github.com/hyczq/html-renderer/blob/main/SECURITY.md) 私下报告。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简要说明发生了什么，以及你期望的结果。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最小、可稳定复现的步骤。
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 看到 ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: 你使用的版本或 commit SHA。
      placeholder: 例如 1.0.0 或 c8bfc01
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js 版本
      placeholder: 例如 22.14.0
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式
      options:
        - Docker Compose
        - 直接运行 node server.js
        - 其他
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请移除其中的域名、Cookie、密钥和其他敏感信息。
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，确认没有重复报告
          required: true
        - label: 我已移除日志中的敏感信息
          required: true

services:
  html-renderer:
    container_name: html-renderer
    build:
      context: .
    image: local/html-renderer:1.0.0
    restart: unless-stopped
    ports:
      - "8899:3000"
    volumes:
      - ./data:/data
    environment:
      PORT: "3000"
      DATA_DIR: "/data"
      BRAND_NAME: "${BRAND_NAME:-HTML 渲染器}"
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      MAX_PASTE_BYTES: "${MAX_PASTE_BYTES:-2097152}"
      FETCH_TIMEOUT_MS: "${FETCH_TIMEOUT_MS:-12000}"
      URL_FETCH_ENABLED: "${URL_FETCH_ENABLED:-1}"
      FETCH_ALLOWED_PORTS: "${FETCH_ALLOWED_PORTS:-80,443}"
      BLOB_GC_GRACE_MS: "${BLOB_GC_GRACE_MS:-600000}"
      LINK_DEFAULT_EXPIRY: "${LINK_DEFAULT_EXPIRY:-7d}"
      LINK_SWEEP_INTERVAL_MS: "${LINK_SWEEP_INTERVAL_MS:-60000}"
      PREVIEW_ORIGIN: "${PREVIEW_ORIGIN:-}"
      PREVIEW_SANDBOX: "${PREVIEW_SANDBOX:-}"
    mem_limit: 128m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

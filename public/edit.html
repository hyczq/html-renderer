<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0e" media="(prefers-color-scheme: dark)">
<title>编辑 - {{BRAND}}</title>
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
/* 编辑页：复用共享页面骨架、顶栏、卡片、表单与按钮 */
.editor-card{padding:26px}
.editor-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.editor-head h1{font-size:20px;font-weight:700;letter-spacing:-.2px}
.editor-code{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:7px;background:var(--info-bg);color:var(--ac);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:600}
.link-settings{margin:0 0 16px;padding:12px 15px;border:1px solid var(--bd);border-radius:var(--r-md);background:var(--in)}
.link-settings summary{cursor:pointer;color:var(--txt2);font-size:13px;font-weight:600;list-style:none}
.link-settings summary::-webkit-details-marker{display:none}
.link-settings summary::after{content:"\25be";float:right;color:var(--txt3)}
.link-settings[open] summary::after{content:"\25b4"}
.ls-grid{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.ls-item{flex:1 1 220px;padding:9px 12px;border:1px solid var(--bd);border-radius:var(--r-sm);background:var(--card)}
.ls-item span{display:block;color:var(--txt3);font-size:11px;font-weight:700;letter-spacing:.3px}
.ls-item strong{display:block;margin-top:3px;font-size:13px;font-weight:600;word-break:break-word}
.ls-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ls-controls .input{flex:1 1 240px}
.ls-msg{margin-top:10px}
.pw-code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;font-weight:700;letter-spacing:.12em}
@media(max-width:600px){
  .ls-controls .btn{flex:1 1 100%;min-height:44px}
}
.editor-card .notice{margin-bottom:16px}
.code-area{min-height:56vh;min-height:56dvh;font-size:13px;line-height:1.65}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.bar .hint{display:flex;align-items:center;gap:8px;margin-left:auto}
.size{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.size.warn{color:var(--warn-text)}
.size.danger{color:var(--danger-text)}
@media(max-width:600px){
  .editor-head h1{font-size:17px}
  .code-area{min-height:46vh;min-height:46dvh;font-size:16px;line-height:1.5;padding:12px}
  .bar{gap:8px}
  .bar .btn{flex:1 1 0;min-height:46px;padding:12px 10px;font-size:14px}
  .bar .hint{flex:1 1 100%;justify-content:space-between;margin-left:0;font-size:11px;padding-top:2px}
}
</style>
</head>
<body>
<div class="page page-wide">
  <header class="topbar">
    <a class="brand" href="/" aria-label="{{BRAND}} 首页">
      <img class="brand-avatar" src="/avatar.svg" alt="">
      <span class="brand-text">
        <span class="brand-name">{{BRAND}}</span>
        <span class="brand-sub">编辑页面</span>
      </span>
    </a>
    <div class="topbar-actions">
      <a class="btn btn-ghost btn-sm" href="{{PREVIEW_ORIGIN}}/p/{{CODE}}" target="_blank" rel="noopener">🔍 预览</a>
    </div>
  </header>

  <main class="card editor-card">
    <div class="editor-head">
      <div>
        <h1>✏️ 编辑页面</h1>
        <span class="editor-code">{{CODE}}</span>
      </div>
    </div>
    <div class="notice">✏️ 修改下面的 HTML 代码，点击“保存”即可立即生效。原链接和编辑密钥保持不变。</div>
    <details class="link-settings" id="linkSettings">
      <summary>⏳ 有效期与 🔒 访问密码</summary>
      <div class="ls-grid">
        <div class="ls-item"><span>有效期</span><strong id="expiryText">—</strong></div>
        <div class="ls-item"><span>访问密码</span><strong id="pwState">—</strong></div>
      </div>
      <div class="ls-controls">
        <input class="input" id="pwInput" type="password" maxlength="64" placeholder="输入 6-64 位自定义密码；留空则自动生成 6 位" autocomplete="new-password" spellcheck="false">
        <button class="btn btn-ghost" id="pwReset" type="button">🔑 生成 / 重置密码</button>
        <button class="btn btn-ghost" id="pwOff" type="button">关闭密码</button>
      </div>
      <div class="notice ls-msg" id="pwMsg" hidden></div>
      <p class="hint">重置后旧密码立即失效；新密码只显示一次。有效期在生成时确定，不能修改。</p>
    </details>
    <div class="field">
      <label for="nm">页面名称（方便日后查找）</label>
      <input class="input" id="nm" maxlength="60" placeholder="例如：公司官网预览 / 游戏 demo" autocomplete="off">
    </div>
    <div class="field">
      <label for="ta">HTML 代码</label>
      <textarea class="input code-area" id="ta" placeholder="加载中..." spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    </div>
    <div class="bar">
      <button class="btn btn-primary" id="svb" type="button" disabled>💾 保存修改</button>
      <a class="btn btn-ghost" href="{{PREVIEW_ORIGIN}}/p/{{CODE}}" target="_blank" rel="noopener">🔍 预览</a>
      <span class="hint"><span id="size" class="size">0 B</span><span>Ctrl/⌘ + S 保存</span></span>
    </div>
  </main>
</div>
<div class="toast" id="ts" role="status" aria-live="polite"></div>
<script>
(function(){
var code="{{CODE}}";
var key=new URLSearchParams(location.search).get("key")||"";
if(!key&&location.hash){key=new URLSearchParams(location.hash.slice(1)).get("key")||""}
var ta=document.getElementById("ta");
var nm=document.getElementById("nm");
var svb=document.getElementById("svb");
var sizeEl=document.getElementById("size");
var dirty=false;
var linkInfo=null;
function updateSize(){
  var n=0;
  try{n=new Blob([ta.value]).size}catch(e){n=ta.value.length}
  sizeEl.textContent=(n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(2)+" MB")+" / 2 MB";
  sizeEl.className="size"+(n>2097152?" danger":n>1887436?" warn":"");
}
function fmtDate(v){try{var d=new Date(v);if(isNaN(d))return String(v);function p(n){return n<10?"0"+n:""+n}return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())}catch(e){return String(v)}}
function renderLinkInfo(){
  if(!linkInfo)return;
  var e=document.getElementById("expiryText");
  if(linkInfo.singleUse)e.textContent="单次访问（首次打开后失效；7 天内未访问也会过期）";
  else if(!linkInfo.expiresAt)e.textContent="永久有效";
  else e.textContent="至 "+fmtDate(linkInfo.expiresAt)+"（到期自动删除）";
  document.getElementById("pwState").textContent=linkInfo.passwordProtected?"已开启":"未开启";
  document.getElementById("pwOff").style.display=linkInfo.passwordProtected?"":"none";
}
function markDirty(){dirty=true;updateSize()}
ta.addEventListener("input",markDirty);
nm.addEventListener("input",function(){dirty=true});
ta.addEventListener("keydown",function(e){
  if(e.key==="Tab"){
    e.preventDefault();
    var s=ta.selectionStart,en=ta.selectionEnd;
    ta.value=ta.value.slice(0,s)+"  "+ta.value.slice(en);
    ta.selectionStart=ta.selectionEnd=s+2;
    markDirty();
  }
});
document.addEventListener("keydown",function(e){
  if((e.ctrlKey||e.metaKey)&&(e.key==="s"||e.key==="S")){
    e.preventDefault();
    if(!svb.disabled)svb.click();
  }
});
window.addEventListener("beforeunload",function(e){
  if(dirty){e.preventDefault();e.returnValue=""}
});
function sts(m,t){var ts=document.getElementById("ts");ts.textContent=m;ts.className="toast show"+(t?" "+t:"");setTimeout(function(){ts.className="toast"+(t?" "+t:"")},2200)}
function copySecret(text){
  function done(){sts("已复制","success")}
  function fallback(){
    var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
    var ok=false;try{ok=document.execCommand("copy")}catch(e){}
    document.body.removeChild(ta);
    if(ok)done();else sts("复制失败，请手动选择","error");
  }
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done).catch(fallback);else fallback();
}
fetch("/api/get?code="+encodeURIComponent(code),{headers:{"X-Edit-Key":key}}).then(function(r){return r.json()}).then(function(d){
if(d.success){ta.value=d.html;nm.value=d.name||"";if(d.name)document.title=d.name+" - 编辑";svb.disabled=false;dirty=false;updateSize();linkInfo=d;renderLinkInfo()}
else{ta.value="";ta.disabled=true;sts("加载失败："+(d.error||"未知错误"),"error")}
}).catch(function(e){ta.value="";ta.disabled=true;sts("网络错误","error")});
svb.addEventListener("click",async function(){
svb.disabled=true;var old=svb.textContent;svb.textContent="保存中...";
try{
var r=await fetch("/api/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:code,key:key,html:ta.value,name:nm.value.trim()})});
var d=await r.json();
if(d.success){dirty=false;sts("✅ 已保存，刷新预览页可见","success")}
else sts("保存失败："+(d.error||"未知错误"),"error");
}catch(e){sts("网络错误","error")}
finally{svb.disabled=false;svb.textContent=old}
});
document.getElementById("pwReset").addEventListener("click",function(){
  var v=document.getElementById("pwInput").value;
  var action=v?"set":"generate";
  if(action==="set"&&(v.length<6||v.length>64)){sts("密码需 6-64 位","error");return}
  var btn=this;btn.disabled=true;var old=btn.textContent;btn.textContent="处理中...";
  var payload={code:code,key:key,action:action};
  if(action==="set")payload.password=v;
  fetch("/api/link/password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}).then(function(r){return r.json()}).then(function(d){
    if(!d.success){sts(d.error||"操作失败","error");return}
    linkInfo=linkInfo||{};linkInfo.passwordProtected=d.passwordProtected;renderLinkInfo();
    var msg=document.getElementById("pwMsg");msg.hidden=false;
    if(d.password){msg.innerHTML='✅ 新密码（仅显示一次）：<code class="pw-code">'+d.password+'</code> <button class="btn btn-ghost btn-sm" id="pwCopy" type="button">复制</button>';var c=document.getElementById("pwCopy");if(c)c.addEventListener("click",function(){copySecret(d.password)});}
    else msg.textContent=d.passwordProtected?"✅ 自定义密码已生效":"✅ 已关闭访问密码";
    document.getElementById("pwInput").value="";
  }).catch(function(){sts("网络错误","error")}).finally(function(){btn.disabled=false;btn.textContent=old});
});
document.getElementById("pwOff").addEventListener("click",function(){
  var btn=this;btn.disabled=true;
  fetch("/api/link/password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:code,key:key,action:"remove"})}).then(function(r){return r.json()}).then(function(d){
    if(!d.success){sts(d.error||"操作失败","error");return}
    linkInfo=linkInfo||{};linkInfo.passwordProtected=false;renderLinkInfo();
    var msg=document.getElementById("pwMsg");msg.hidden=false;msg.textContent="✅ 已关闭访问密码";
  }).catch(function(){sts("网络错误","error")}).finally(function(){btn.disabled=false});
});
})();
</script>
</body>
</html>

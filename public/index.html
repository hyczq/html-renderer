<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0e" media="(prefers-color-scheme: dark)">
<meta name="preview-origin" content="{{PREVIEW_ORIGIN}}">
<title>{{BRAND}}</title>
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
/* 首页专属布局：共用 theme.css 的页面骨架与组件 */
.feature-bar{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:16px;padding:9px 14px;border:1px solid var(--bd);border-radius:var(--r-pill);background:var(--card);box-shadow:var(--sh-sm);color:var(--txt2);font-size:12.5px;line-height:1.4;text-align:center}
.feature-bar strong{color:var(--txt);font-weight:700}
.feature-tag{padding:3px 10px;border-radius:var(--r-pill);background:var(--gr);color:#fff;font-size:11px;font-weight:700;white-space:nowrap}
.generator{padding:24px}
.generator .seg{margin-bottom:22px}
.pn{display:none}
.pn.active{display:block}
.dropzone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:158px;padding:24px 16px;border:1.5px dashed var(--bd-strong);border-radius:var(--r-md);background:var(--in);color:var(--txt2);text-align:center;cursor:pointer;transition:border-color .2s var(--ease),background .2s var(--ease)}
.dropzone:hover,.dropzone:focus-visible{border-color:var(--ac);background:var(--cardh);outline:none}
.dropzone .di{font-size:34px;line-height:1}
.dropzone .dt{font-size:14px;font-weight:600}
.dropzone .dh{color:var(--txt3);font-size:12px}
.file-name{min-height:18px;margin-top:8px;padding-left:2px;color:var(--ac-text);font-size:13px;font-weight:600;word-break:break-all}
.generator .hint{margin-top:14px;text-align:center}
.result{display:none;overflow:hidden;margin-top:20px;border:1px solid var(--bd);border-radius:var(--r-lg);background:var(--bg2)}
.result.show{display:block}
.result.success{border-color:var(--info-bd)}
.result.error{border-color:var(--err-bd);background:var(--err-bg)}
.result-inner{padding:16px}
.result-label{margin-bottom:10px;color:var(--txt3);font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.link-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:11px 14px;border:1px solid var(--bd);border-radius:var(--r-md);background:var(--card)}
.link-row.edit{border-color:var(--ok-bd);background:var(--ok-bg)}
.link-main{flex:1;min-width:0}
.link-label{display:block;margin-bottom:4px;color:var(--txt3);font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.link-row.edit .link-label{color:var(--ok-text)}
.link-row a{display:block;color:var(--ac-text);font-size:13px;font-weight:500;line-height:1.45;word-break:break-all}
.link-row.edit a{color:var(--ok-text)}
.link-row .btn{flex:none}
.result .notice{margin:8px 0}
.result .btn-block{margin-top:8px}
.result .hint{margin-top:12px;text-align:center}
.loading-inline{padding:12px 0;color:var(--txt3);font-size:14px}
@media(max-width:600px){
  .feature-bar{gap:6px;padding:8px 12px;font-size:11.5px}
  .feature-tag{padding:2px 8px;font-size:10.5px}
  .generator{padding:18px}
  .generator .seg{margin-bottom:18px}
  .dropzone{min-height:140px;padding:20px 12px}
  .link-row{flex-direction:column;align-items:stretch}
  .link-row .btn{align-self:flex-end}
  .result-inner{padding:14px}
}
</style>
<link rel="icon" href="/avatar.svg">
</head>
<body>
<div class="page">
  <header class="topbar">
    <a class="brand" href="/" aria-label="{{BRAND}} 首页">
      <img class="brand-avatar" src="/avatar.svg" alt="">
      <span class="brand-text">
        <span class="brand-name">{{BRAND}}</span>
        <span class="brand-sub">永久链接 · 自动去重 · 历史记录</span>
      </span>
    </a>
    <div class="topbar-actions">
      <a class="btn btn-ghost btn-sm" id="ub" href="/login">👤 登录</a>
      <button class="icon-btn" id="tt" type="button" aria-label="切换深色模式"><span id="ti">🌙</span></button>
    </div>
  </header>

  <div class="feature-bar">
    <span aria-hidden="true">✨</span>
    <span><strong>{{BRAND}}</strong> · 永久链接 · 零依赖自托管 · 支持 URL / 代码 / 上传文件</span>
    <span class="feature-tag">立即体验 ➜</span>
  </div>

  <main class="card generator">
    <div class="seg" role="tablist" aria-label="选择生成方式">
      <button class="tb active" data-tab="url" role="tab" aria-selected="true">🌐 从 URL</button>
      <button class="tb" data-tab="code" role="tab" aria-selected="false">📝 粘贴代码</button>
      <button class="tb" data-tab="upload" role="tab" aria-selected="false">📤 上传文件</button>
    </div>

    <div class="pn active" id="p-url">
      <div class="field">
        <label for="urlInput">GitHub / Bitbucket 原始链接</label>
        <textarea class="input" id="urlInput" placeholder="https://raw.githubusercontent.com/用户/仓库/分支/文件.html" inputmode="url" autocapitalize="off" spellcheck="false" autocomplete="off"></textarea>
      </div>
    </div>

    <div class="pn" id="p-code">
      <div class="field">
        <label for="codeInput">直接粘贴 HTML 代码</label>
        <textarea class="input" id="codeInput" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="&lt;!DOCTYPE html&gt;&#10;&lt;html&gt;&#10;&lt;head&gt;&lt;title&gt;我的页面&lt;/title&gt;&lt;/head&gt;&#10;&lt;body&gt;&lt;h1&gt;Hello World&lt;/h1&gt;&lt;/body&gt;&#10;&lt;/html&gt;"></textarea>
      </div>
    </div>

    <div class="pn" id="p-upload">
      <div class="field">
        <label>上传 HTML 文件（最大 2MB）</label>
        <div class="dropzone" id="dz" role="button" tabindex="0" aria-label="选择 HTML 文件">
          <div class="di">📄</div>
          <div class="dt">拖拽或点击选择文件</div>
          <div class="dh">支持 .html / .htm · 最大 2MB</div>
          <input type="file" id="fi" accept=".html,.htm" style="display:none">
        </div>
        <div class="file-name" id="fn"></div>
      </div>
    </div>

    <div class="field">
      <label for="pageName">页面名称（可选）</label>
      <input class="input" id="pageName" maxlength="60" placeholder="例如：公司官网预览 / 游戏 demo，方便日后查找" autocomplete="off">
    </div>

    <button class="btn btn-primary btn-block" id="genBtn">🚀 生成永久链接</button>
    <p class="hint">登录后自动保存历史记录；相同内容自动复用，不重复存储 · Ctrl/⌘ + Enter 快速生成</p>
    <div class="result" id="genResult" role="status" aria-live="polite"><div class="result-inner"></div></div>
  </main>
</div>
<script>
(function(){
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function cp(txt,btn){
var done=function(){var o=btn.textContent;btn.textContent="已复制!";setTimeout(function(){btn.textContent=o},2000)};
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(function(){fa()})}else{fa()}
function fa(){var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.top="0";ta.style.left="0";ta.style.opacity="0";document.body.appendChild(ta);ta.focus();ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(ta);if(ok)done();else prompt("请手动复制：",txt)}
}
var tabs=document.querySelectorAll(".tb");
var pns={url:document.getElementById("p-url"),code:document.getElementById("p-code"),upload:document.getElementById("p-upload")};
var curTab="url";
for(var i=0;i<tabs.length;i++){tabs[i].addEventListener("click",function(){
for(var j=0;j<tabs.length;j++){tabs[j].classList.remove("active");tabs[j].setAttribute("aria-selected","false")}
this.classList.add("active");this.setAttribute("aria-selected","true");
for(var k in pns)pns[k].classList.remove("active");
curTab=this.getAttribute("data-tab");
pns[curTab].classList.add("active");
document.getElementById("genResult").classList.remove("show");
})}
function sr(el,data,isErr){
isErr=isErr||false;
var inner=el.querySelector(".result-inner")||el;
el.className="result show"+(isErr?" error":" success");
if(isErr){inner.innerHTML="<div class=\"et\">❌ "+esc(data)+"</div>";return}
var pvBase=(document.querySelector('meta[name="preview-origin"]')||{}).content||window.location.origin;
var pv=pvBase+"/p/"+data.code;
var ed=window.location.origin+"/edit/"+data.code+"#key="+data.editKey;
inner.innerHTML="<div class=\"result-label\">"+(data.reused?"♻️ 相同内容已存在，已复用原链接（未重复存储）":"✅ 永久链接已生成")+"</div>"+
(data.name?'<div class="notice">🏷️ 页面名称：'+esc(data.name)+'</div>':"")+
"<div class=\"link-row\"><div class=\"link-main\"><span class=\"link-label\">🔗 预览链接（分享这个）</span><a href=\""+pv+"\" target=\"_blank\" rel=\"noopener\">"+pv+"</a></div><button class=\"btn btn-ghost btn-sm\" id=\"c1\">复制</button></div>"+
"<div class=\"link-row edit\"><div class=\"link-main\"><span class=\"link-label\">✏️ 编辑链接（自己保存）</span><a href=\""+ed+"\" target=\"_blank\" rel=\"noopener\">"+ed+"</a></div><button class=\"btn btn-ghost btn-sm\" id=\"c2\">复制</button></div>"+
"<div class=\"notice"+(window.__loggedIn?"":" warn")+"\">"+(window.__loggedIn?'编辑链接已保存到 <a href="/my">我的页面</a>，可随时找回。':'⚠️ 编辑链接只显示这一次，请立即保存！丢失后无法找回。')+"</div>"+
"<button class=\"btn btn-ghost btn-block\" id=\"call\">📋 复制全部信息</button>"+
"<p class=\"hint\">"+(window.__loggedIn?'已保存到 <a href="/my">我的页面</a>':'<a href="/login">登录</a>后可保存历史，方便下次查找')+"</p>";
try{el.scrollIntoView({behavior:"smooth",block:"nearest"})}catch(e){}
var c1=inner.querySelector("#c1"),c2=inner.querySelector("#c2"),call=inner.querySelector("#call");
if(c1)c1.addEventListener("click",function(){cp(pv,this)});
if(c2)c2.addEventListener("click",function(){cp(ed,this)});
if(call)call.addEventListener("click",function(){
var txt="预览："+pv+"\n编辑："+ed;
cp(txt,this);
});
}
async function gl(payload,el){
el.classList.remove("show");
var inner=el.querySelector(".result-inner")||el;
inner.innerHTML="<div class=\"loading-inline\">⏳ 生成中...</div>";
el.className="result show";
var btn=document.getElementById("genBtn");
if(btn){btn.disabled=true;btn.dataset.old=btn.textContent;btn.textContent="⏳ 生成中..."}
try{
var r=await fetch("/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
var d=await r.json();
if(d.success)sr(el,d);else sr(el,d.error||"生成失败",true);
}catch(e){sr(el,"网络错误，请重试",true)}
finally{
if(btn){btn.disabled=false;btn.textContent=btn.dataset.old||"🚀 生成永久链接"}
}
}
function nm(){return document.getElementById("pageName").value.trim()}
["urlInput","codeInput"].forEach(function(id){
var el=document.getElementById(id);
if(el)el.addEventListener("keydown",function(e){
if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();document.getElementById("genBtn").click()}
});
});
document.getElementById("genBtn").addEventListener("click",function(){
if(curTab==="url"){
var u=document.getElementById("urlInput").value.trim();
if(!u){sr(document.getElementById("genResult"),"请输入有效的 URL",true);return}
try{new URL(u)}catch(e){sr(document.getElementById("genResult"),"URL 格式无效",true);return}
gl({type:"url",url:u,name:nm()},document.getElementById("genResult"));
}else if(curTab==="code"){
var c=document.getElementById("codeInput").value.trim();
if(!c){sr(document.getElementById("genResult"),"请粘贴 HTML 代码",true);return}
gl({type:"code",code:c,name:nm()},document.getElementById("genResult"));
}else{
var sf2=window.__selectedFile;
if(!sf2){sr(document.getElementById("genResult"),"请先选择文件",true);return}
var rd=new FileReader();
rd.onload=function(ev){gl({type:"code",code:ev.target.result,name:nm()},document.getElementById("genResult"))};
rd.onerror=function(){sr(document.getElementById("genResult"),"文件读取失败",true)};
rd.readAsText(sf2);
}
});
var dz=document.getElementById("dz"),fi=document.getElementById("fi"),fnn=document.getElementById("fn");
dz.addEventListener("click",function(){fi.click()});
dz.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();fi.click()}});
dz.addEventListener("dragover",function(e){e.preventDefault();dz.style.borderColor="var(--ac)"});
dz.addEventListener("dragleave",function(){dz.style.borderColor=""});
dz.addEventListener("drop",function(e){e.preventDefault();dz.style.borderColor="";if(e.dataTransfer.files.length>0)hf(e.dataTransfer.files[0])});
fi.addEventListener("change",function(e){if(e.target.files.length>0)hf(e.target.files[0])});
function hf(f){
if(!f.name.endsWith(".html")&&!f.name.endsWith(".htm")){alert("仅支持 .html / .htm");return}
if(f.size>2*1024*1024){alert("文件过大，最大 2MB（当前 "+(f.size/1024/1024).toFixed(2)+"MB）");return}
window.__selectedFile=f;fnn.textContent="✅ "+f.name+" ("+(f.size/1024).toFixed(1)+" KB)";
document.getElementById("genResult").classList.remove("show");
}
})();
</script>
<script>
(function(){
fetch("/api/me").then(function(r){return r.json()}).then(function(d){
if(d.success){window.__loggedIn=true;var a=document.getElementById("ub");a.textContent="👤 "+d.user.username;a.href="/my";a.title="我的页面"}
}).catch(function(){});
})();
</script>
</body>
</html>

body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px 16px;padding-top:80px;transition:background .35s,color .35s}

.copy-all{padding:10px 16px;border:1px solid var(--bd);border-radius:12px;background:transparent;color:var(--txt2);cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;width:100%;margin-top:8px}
.copy-all:hover{background:var(--cardh)}
.ha{display:flex;align-items:center;gap:8px}.ub{font-size:13px;font-weight:600;color:var(--ac);text-decoration:none;padding:8px 14px;border-radius:30px;background:var(--tab);border:.5px solid var(--bd);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}.ub:hover{background:var(--cardh)}@media(max-width:600px){.ub{font-size:12px;padding:6px 10px;max-width:104px}.ha{gap:6px}}
@media(max-width:600px){body{padding:16px 12px;padding-top:72px}.box{padding:28px 20px;border-radius:32px}.bn{font-size:19px}.av{width:40px;height:40px}.tb{font-size:12px;padding:8px 4px}.btn{font-size:16px;padding:14px}.rk{flex-direction:column;align-items:stretch;gap:8px}.rk .cb{align-self:flex-end}}
.tip2{margin-top:14px;font-size:12px;color:var(--txt3);text-align:center;line-height:1.6}
.ig input{width:100%;padding:15px 18px;border:1.5px solid var(--bd);border-radius:18px;font-size:15px;font-family:inherit;background:var(--in);color:var(--txt);line-height:1.4}
.ig input:focus{outline:none;border-color:var(--ac);background:var(--bg2);box-shadow:0 0 0 4px rgba(0,122,255,.08)}
.hintline{margin-top:12px;font-size:12px;color:var(--txt3);text-align:center;line-height:1.6}.hintline a{color:var(--ac);text-decoration:none;font-weight:600}.warn a{color:inherit;font-weight:700;text-decoration:underline}@media(max-width:420px){.av{width:40px;height:40px}.bn{font-size:18px}.ub{max-width:84px;font-size:11.5px;padding:6px 8px}}
/* ---------- 移动端适配 ---------- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,a:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
@media(max-width:600px){
  body{padding:16px max(12px,env(safe-area-inset-left)) max(24px,env(safe-area-inset-bottom));padding-top:calc(64px + env(safe-area-inset-top));align-items:flex-start}
  .mw{padding-top:max(8px,env(safe-area-inset-top))}

  .tc{margin-bottom:24px}
  .tb{min-height:40px;font-size:12.5px}
  .ig{margin-bottom:20px}
  textarea,.ig input{font-size:16px}
  .dz{min-height:150px;padding:18px 12px}
  .btn{font-size:16px;min-height:50px;padding:14px 18px}

  .rk a{font-size:13px}

}

  body{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}

  .ml{animation:none;padding-left:0}

<body>
<div class="mw"><div class="mc">
<span style="color:var(--mt);font-weight:700">🚀</span>
<div class="ml"><span>✨ {{BRAND}} · 永久链接 · 零依赖自托管 · 支持 URL / 代码 / 上传文件<span class="bdg">立即体验 ➜</span><span style="opacity:.3;margin:0 14px">│</span>✨ {{BRAND}} · 永久链接 · 零依赖自托管 · 支持 URL / 代码 / 上传文件<span class="bdg">立即体验 ➜</span></span></div>
<span style="color:var(--mt);font-weight:700">⚡</span>
</div></div>
<div class="box">
<header class="hd"><div class="br">
<img class="av" src="/avatar.svg" alt="{{BRAND}}">
<div class="bt"><span class="bn">{{BRAND}}</span><span class="bs">永久链接 · 自动去重 · 历史记录</span></div>
</div><div class="ha"><a class="ub" id="ub" href="/login">👤 登录</a><button class="tt" id="tt" aria-label="切换深色模式"><span id="ti">🌙</span></button></div></header>
<div class="tc"><button class="tb active" data-tab="url">🌐 从 URL</button><button class="tb" data-tab="code">📝 粘贴代码</button><button class="tb" data-tab="upload">📤 上传文件</button></div>
<div class="pn active" id="p-url"><div class="ig"><label>GitHub / Bitbucket 原始链接</label><textarea id="urlInput" placeholder="https://raw.githubusercontent.com/用户/仓库/分支/文件.html" inputmode="url" autocapitalize="off" spellcheck="false" autocomplete="off"></textarea></div></div>
<div class="pn" id="p-code"><div class="ig"><label>直接粘贴 HTML 代码</label><textarea id="codeInput" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="&lt;!DOCTYPE html&gt;&#10;&lt;html&gt;&#10;&lt;head&gt;&lt;title&gt;我的页面&lt;/title&gt;&lt;/head&gt;&#10;&lt;body&gt;&lt;h1&gt;Hello World&lt;/h1&gt;&lt;/body&gt;&#10;&lt;/html&gt;"></textarea></div></div>
<div class="pn" id="p-upload"><div class="ig"><label>上传 HTML 文件（最大 2MB）</label><div class="dz" id="dz" role="button" tabindex="0" aria-label="选择 HTML 文件"><div class="di">📄</div><div class="dt">拖拽或点击选择文件</div><div class="dh">支持 .html / .htm · 最大 2MB</div><input type="file" id="fi" accept=".html,.htm" style="display:none"></div><div class="fn" id="fn"></div></div></div>
<div class="ig"><label>页面名称（可选）</label><input id="pageName" maxlength="60" placeholder="例如：公司官网预览 / 游戏 demo，方便日后查找" autocomplete="off"></div>
<button class="btn" id="genBtn">🚀 生成永久链接</button>
<p class="tip2">登录后自动保存历史记录；相同内容自动复用，不重复存储 · Ctrl/⌘ + Enter 快速生成</p>
<div class="rb" id="genResult" role="status" aria-live="polite"><div class="ri"></div></div>
</div>
<script>
(function(){
function gs(k){try{return localStorage.getItem(k)}catch(e){return null}}
function ss(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var tt=document.getElementById("tt"),ti=document.getElementById("ti"),he=document.documentElement;
var pd=window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches;
var ct=gs("theme")||(pd?"dark":"light");
function at(t){he.setAttribute("data-theme",t);ct=t;ss("theme",t);ti.textContent=t==="light"?"🌙":"☀️"}
at(ct);
tt.addEventListener("click",function(){at(ct==="light"?"dark":"light")});
var tabs=document.querySelectorAll(".tb");
var pns={url:document.getElementById("p-url"),code:document.getElementById("p-code"),upload:document.getElementById("p-upload")};
var curTab="url";
for(var i=0;i<tabs.length;i++){tabs[i].addEventListener("click",function(){
for(var j=0;j<tabs.length;j++)tabs[j].classList.remove("active");
this.classList.add("active");
for(var k in pns)pns[k].classList.remove("active");
curTab=this.getAttribute("data-tab");
pns[curTab].classList.add("active");
document.getElementById("genResult").classList.remove("show");
})}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function cp(txt,btn){
var done=function(){var o=btn.textContent;btn.textContent="已复制!";setTimeout(function(){btn.textContent=o},2000)};
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(function(){fa()})}else{fa()}
function fa(){var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.top="0";ta.style.left="0";ta.style.opacity="0";document.body.appendChild(ta);ta.focus();ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(ta);if(ok)done();else prompt("请手动复制：",txt)}
}
function sr(el,data,isErr){
isErr=isErr||false;
var inner=el.querySelector(".ri")||el;
el.className="rb show"+(isErr?" error":" success");
if(isErr){inner.innerHTML="<div class=\"et\">❌ "+esc(data)+"</div>";return}
var pvBase=(document.querySelector('meta[name="preview-origin"]')||{}).content||window.location.origin;
var pv=pvBase+"/p/"+data.code;
var ed=window.location.origin+"/edit/"+data.code+"#key="+data.editKey;
inner.innerHTML="<div class=\"rl\">"+(data.reused?"♻️ 相同内容已存在，已复用原链接（未重复存储）":"✅ 永久链接已生成")+"</div>"+
(data.name?'<div class="exp-info">🏷️ 页面名称：'+esc(data.name)+'</div>':"")+
"<div class=\"rk\"><div style=\"flex:1;min-width:0\"><span class=\"lbl\">🔗 预览链接（分享这个）</span><a href=\""+pv+"\" target=\"_blank\">"+pv+"</a></div><button class=\"cb\" id=\"c1\">复制</button></div>"+
"<div class=\"rk edit-link\"><div style=\"flex:1;min-width:0\"><span class=\"lbl\">✏️ 编辑链接（自己保存）</span><a href=\""+ed+"\" target=\"_blank\">"+ed+"</a></div><button class=\"cb\" id=\"c2\">复制</button></div>"+
"<div class=\"warn\">"+(window.__loggedIn?'编辑链接已保存到 <a href="/my">我的页面</a>，可随时找回。':'⚠️ 编辑链接只显示这一次，请立即保存！丢失后无法找回。')+"</div>"+
"<button class=\"copy-all\" id=\"call\">📋 复制全部信息</button>"+
"<div class=\"hintline\">"+(window.__loggedIn?'已保存到 <a href="/my">我的页面</a>':'<a href="/login">登录</a>后可保存历史，方便下次查找')+"</div>";
try{el.scrollIntoView({behavior:"smooth",block:"nearest"})}catch(e){}
var c1=inner.querySelector("#c1"),c2=inner.querySelector("#c2"),call=inner.querySelector("#call");
if(c1)c1.addEventListener("click",function(){cp(pv,this)});
if(c2)c2.addEventListener("click",function(){cp(ed,this)});
if(call)call.addEventListener("click",function(){
var txt="预览："+pv+"\n编辑："+ed;
cp(txt,this);
});
}
async function gl(payload,el){
el.classList.remove("show");
var inner=el.querySelector(".ri")||el;
inner.innerHTML="<div style=\"padding:12px 0;color:var(--txt3)\">⏳ 生成中...</div>";
el.className="rb show";
var btn=document.getElementById("genBtn");
if(btn){btn.disabled=true;btn.dataset.old=btn.textContent;btn.textContent="⏳ 生成中..."}
try{
var r=await fetch("/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
var d=await r.json();
if(d.success)sr(el,d);else sr(el,d.error||"生成失败",true);
}catch(e){sr(el,"网络错误，请重试",true)}
finally{
if(btn){btn.disabled=false;btn.textContent=btn.dataset.old||"🚀 生成永久链接"}
}
}
function nm(){return document.getElementById("pageName").value.trim()}
["urlInput","codeInput"].forEach(function(id){
var el=document.getElementById(id);
if(el)el.addEventListener("keydown",function(e){
if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();document.getElementById("genBtn").click()}
});
});
document.getElementById("genBtn").addEventListener("click",function(){
if(curTab==="url"){
var u=document.getElementById("urlInput").value.trim();
if(!u){sr(document.getElementById("genResult"),"请输入有效的 URL",true);return}
try{new URL(u)}catch(e){sr(document.getElementById("genResult"),"URL 格式无效",true);return}
gl({type:"url",url:u,name:nm()},document.getElementById("genResult"));
}else if(curTab==="code"){
var c=document.getElementById("codeInput").value.trim();
if(!c){sr(document.getElementById("genResult"),"请粘贴 HTML 代码",true);return}
gl({type:"code",code:c,name:nm()},document.getElementById("genResult"));
}else{
var sf2=window.__selectedFile;
if(!sf2){sr(document.getElementById("genResult"),"请先选择文件",true);return}
var rd=new FileReader();
rd.onload=function(ev){gl({type:"code",code:ev.target.result,name:nm()},document.getElementById("genResult"))};
rd.onerror=function(){sr(document.getElementById("genResult"),"文件读取失败",true)};
rd.readAsText(sf2);
}
});
var dz=document.getElementById("dz"),fi=document.getElementById("fi"),fnn=document.getElementById("fn");
dz.addEventListener("click",function(){fi.click()});
dz.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();fi.click()}});
dz.addEventListener("dragover",function(e){e.preventDefault();dz.style.borderColor="var(--ac)"});
dz.addEventListener("dragleave",function(){dz.style.borderColor=""});
dz.addEventListener("drop",function(e){e.preventDefault();dz.style.borderColor="";if(e.dataTransfer.files.length>0)hf(e.dataTransfer.files[0])});
fi.addEventListener("change",function(e){if(e.target.files.length>0)hf(e.target.files[0])});

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0e" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<title>访问密码 - {{BRAND}}</title>
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
.lock-wrap{display:flex;justify-content:center;padding-top:8vh}
.lock-card{width:100%;max-width:420px;padding:30px 26px;text-align:center}
.lock-icon{font-size:38px;line-height:1}
.lock-card h1{margin-top:12px;font-size:20px;font-weight:700;letter-spacing:-.2px}
.lock-card .sub{margin-top:6px;color:var(--txt3);font-size:13px;line-height:1.6}
.lock-card .notice{margin:16px 0 0;text-align:left}
.lock-form{margin-top:18px;text-align:left}
.lock-form .input{margin-bottom:10px;text-align:center;letter-spacing:.18em}
.lock-form .btn{min-height:46px}
.lock-foot{margin-top:16px;color:var(--txt3);font-size:12px;line-height:1.6}
.lock-code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:600;color:var(--txt2)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
<link rel="icon" href="/avatar.svg">
</head>
<body>
<div class="page">
  <header class="topbar">
    <a class="brand" href="/" aria-label="{{BRAND}} 首页">
      <img class="brand-avatar" src="/avatar.svg" alt="">
      <span class="brand-text">
        <span class="brand-name">{{BRAND}}</span>
        <span class="brand-sub">受保护的预览链接</span>
      </span>
    </a>
    <div class="topbar-actions">
      <button class="icon-btn" id="tt" type="button" aria-label="切换深色模式"><span id="ti">🌙</span></button>
    </div>
  </header>

  <div class="lock-wrap">
    <main class="card lock-card">
      <div class="lock-icon" aria-hidden="true">🔒</div>
      <h1>此链接受密码保护</h1>
      <div class="sub">请输入访问密码后继续<br><span class="lock-code">{{CODE}}</span></div>
      {{ERROR_BLOCK}}
      <form class="lock-form" method="post" action="/p/{{CODE}}">
        <label class="sr-only" for="password">访问密码</label>
        <input class="input" id="password" name="password" type="password" maxlength="64" placeholder="输入访问密码" autocomplete="current-password" autofocus required>
        <button class="btn btn-primary btn-block" type="submit">解锁访问</button>
      </form>
      <p class="lock-foot">密码由链接创建者设置。若已遗忘，请联系创建者重置密码。</p>
    </main>
  </div>
</div>
</body>
</html>

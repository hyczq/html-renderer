<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>登录 - {{BRAND}}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f2f2f7;--bg2:#fff;--card:rgba(255,255,255,.72);--cardh:rgba(255,255,255,.88);--txt:#1c1c1e;--txt2:#3a3a3c;--txt3:#8e8e93;--bd:rgba(60,60,67,.08);--ac:#007aff;--sh:0 20px 50px rgba(0,0,0,.06);--gr:linear-gradient(135deg,#007aff,#5856d6);--tab:rgba(118,118,128,.12);--taba:#fff;--in:rgba(118,118,128,.06);--rb:rgba(0,122,255,.06);--rbd:rgba(0,122,255,.15);--eb:rgba(255,59,48,.06);--ebd:rgba(255,59,48,.15)}
[data-theme="dark"]{--bg:#0b0b0e;--bg2:#1c1c1e;--card:rgba(28,28,30,.75);--cardh:rgba(44,44,46,.9);--txt:#f5f5f7;--txt2:#aeaeb2;--txt3:#636366;--bd:rgba(255,255,255,.08);--ac:#0a84ff;--sh:0 20px 50px rgba(0,0,0,.7);--tab:rgba(118,118,128,.18);--taba:#2c2c2e;--in:rgba(118,118,128,.1);--rb:rgba(10,132,255,.1);--rbd:rgba(10,132,255,.2);--eb:rgba(255,69,58,.08);--ebd:rgba(255,69,58,.18)}
body{font-family:-apple-system,Helvetica Neue,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px 16px;transition:background .35s,color .35s}
.box{max-width:520px;width:100%;background:var(--card);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-radius:44px;padding:40px 36px;box-shadow:var(--sh),inset 0 0 0 .5px rgba(255,255,255,.1);border:.5px solid var(--bd)}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}
.br{display:flex;align-items:center;gap:14px}
.av{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--bd);border:1px solid var(--bd);flex-shrink:0}
.bt{display:flex;flex-direction:column}
.bn{font-size:21px;font-weight:700;letter-spacing:-.3px;background:var(--gr);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.2}
.bs{font-size:12px;font-weight:500;color:var(--txt3);letter-spacing:.2px;margin-top:2px}
.tt{width:40px;height:40px;border-radius:50%;background:var(--tab);border:.5px solid var(--bd);color:var(--txt2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;text-decoration:none}
.tc{display:flex;gap:4px;margin-bottom:28px;background:var(--tab);border-radius:40px;padding:4px}
.tb{flex:1;padding:10px 8px;border:none;border-radius:32px;font-size:14px;font-weight:600;cursor:pointer;background:transparent;color:var(--txt3);font-family:inherit}
.tb.active{background:var(--taba);color:var(--txt);box-shadow:0 8px 30px rgba(0,0,0,.04);border:.5px solid var(--bd)}
.pn{display:none}.pn.active{display:block}
.ig{margin-bottom:18px}
.ig label{display:block;font-size:13px;font-weight:600;color:var(--txt2);margin-bottom:8px}
input{width:100%;padding:15px 18px;border:1.5px solid var(--bd);border-radius:18px;font-size:15px;font-family:inherit;background:var(--in);color:var(--txt);line-height:1.4}
input:focus{outline:none;border-color:var(--ac);background:var(--bg2);box-shadow:0 0 0 4px rgba(0,122,255,.08)}
.pw{position:relative}
.pw input{padding-right:52px}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:transparent;font-size:17px;cursor:pointer;color:var(--txt3);padding:8px;line-height:1;border-radius:50%}
.eye:hover{background:var(--tab)}
.btn{width:100%;padding:16px 20px;border:none;border-radius:40px;font-size:17px;font-weight:600;cursor:pointer;background:var(--gr);color:#fff;box-shadow:0 4px 16px rgba(0,122,255,.18);font-family:inherit;margin-top:6px}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default}
.rb{margin-top:20px;border-radius:16px;display:none;overflow:hidden;border:.5px solid var(--bd);background:var(--bg2)}
.rb.show{display:block}
.rb.success{border-color:var(--rbd);background:var(--rb)}
.rb.error{border-color:var(--ebd);background:var(--eb)}
.ri{padding:14px 18px;font-size:14px;font-weight:500}
.et{color:#ff3b30}
.ok{color:#34c759}
.tip{margin-top:22px;font-size:12px;color:var(--txt3);text-align:center;line-height:1.6}
.tip a{color:var(--ac);text-decoration:none;font-weight:600}
@media(max-width:600px){body{padding:16px 12px}.box{padding:28px 20px;border-radius:32px}.bn{font-size:19px}}
</style>
</head>
<body>
<div class="box">
  <header class="hd">
    <div class="br">
      <img class="av" src="/avatar.svg" alt="{{BRAND}}">
      <div class="bt"><span class="bn">{{BRAND}}</span><span class="bs">登录后保存历史 · 相同内容自动复用</span></div>
    </div>
    <a class="tt" href="/" title="返回首页">✕</a>
  </header>
  <div class="tc">
    <button class="tb active" data-tab="login">登录</button>
    <button class="tb" data-tab="reg">注册</button>
  </div>
  <div class="pn active" id="p-login">
    <div class="ig"><label for="lu">用户名</label><input id="lu" autocomplete="username" placeholder="请输入用户名" autofocus></div>
    <div class="ig"><label for="lp">密码</label><div class="pw"><input id="lp" type="password" autocomplete="current-password" placeholder="请输入密码"><button type="button" class="eye" data-for="lp" aria-label="显示密码">👁️</button></div></div>
  </div>
  <div class="pn" id="p-reg">
    <div class="ig"><label for="ru">用户名</label><input id="ru" autocomplete="username" placeholder="3-32 位，中英文 / 数字 / _ / -"></div>
    <div class="ig"><label for="rp">密码</label><div class="pw"><input id="rp" type="password" autocomplete="new-password" placeholder="至少 6 位"><button type="button" class="eye" data-for="rp" aria-label="显示密码">👁️</button></div></div>
    <div class="ig"><label for="rp2">确认密码</label><div class="pw"><input id="rp2" type="password" autocomplete="new-password" placeholder="再次输入密码"><button type="button" class="eye" data-for="rp2" aria-label="显示密码">👁️</button></div></div>
  </div>
  <button class="btn" id="go">登录</button>
  <div class="rb" id="res"><div class="ri"></div></div>
  <p class="tip">登录后可随时找回历史链接，避免重复生成<br><a href="/">← 返回首页继续免登录生成</a></p>
</div>
<script>
(function(){
function gs(k){try{return localStorage.getItem(k)}catch(e){return null}}
function ss(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var he=document.documentElement;
var pd=window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches;
var ct=gs("theme")||(pd?"dark":"light");
he.setAttribute("data-theme",ct);
var curTab="login";
var tabs=document.querySelectorAll(".tb");
var pns={login:document.getElementById("p-login"),reg:document.getElementById("p-reg")};
var go=document.getElementById("go");
for(var i=0;i<tabs.length;i++){tabs[i].addEventListener("click",function(){
  for(var j=0;j<tabs.length;j++)tabs[j].classList.remove("active");
  this.classList.add("active");
  for(var k in pns)pns[k].classList.remove("active");
  curTab=this.getAttribute("data-tab");
  pns[curTab].classList.add("active");
  go.textContent=curTab==="login"?"登录":"注册并登录";
  document.getElementById("res").className="rb";
});}
function show(msg,ok){
  var rb=document.getElementById("res");rb.className="rb show "+(ok?"success":"error");
  rb.querySelector(".ri").innerHTML='<div class="'+(ok?"ok":"et")+'">'+esc(msg)+'</div>';
}
document.querySelectorAll(".eye").forEach(function(b){
  b.addEventListener("click",function(){
    var el=document.getElementById(b.getAttribute("data-for"));
    if(!el)return;
    var show=el.type==="password";
    el.type=show?"text":"password";
    b.textContent=show?"🙈":"👁️";
    b.setAttribute("aria-label",show?"隐藏密码":"显示密码");
  });
});
document.querySelector(".box").addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target&&e.target.tagName==="INPUT"){e.preventDefault();go.click()}
});
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function post(url,data){
  return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)}).then(function(r){return r.json()});
}
go.addEventListener("click",async function(){
  var btn=go;var old=btn.textContent;btn.disabled=true;btn.textContent="请稍候...";
  try{
    if(curTab==="login"){
      var u=document.getElementById("lu").value.trim();
      var p=document.getElementById("lp").value;
      if(!u||!p){show("请输入用户名和密码",false);return}
      var d=await post("/api/login",{username:u,password:p});
      if(d.success){show("登录成功，正在跳转...",true);location.href="/my"}
      else show(d.error||"登录失败",false);
    }else{
      var u2=document.getElementById("ru").value.trim();
      var p2=document.getElementById("rp").value;
      var p3=document.getElementById("rp2").value;
      if(!u2||!p2){show("请输入用户名和密码",false);return}
      if(p2!==p3){show("两次输入的密码不一致",false);return}
      var d2=await post("/api/register",{username:u2,password:p2});
      if(d2.success){show("注册成功，正在跳转...",true);location.href="/my"}
      else show(d2.error||"注册失败",false);
    }
  }catch(e){show("网络错误，请重试",false)}
  finally{btn.disabled=false;btn.textContent=old}
});
fetch("/api/me").then(function(r){return r.json()}).then(function(d){
  if(d.success){show("已登录为 "+d.user.username+"，3 秒后前往我的页面...",true);setTimeout(function(){location.href="/my"},1500)}
}).catch(function(){});
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0e" media="(prefers-color-scheme: dark)">
<title>登录 - {{BRAND}}</title>
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
/* 登录页：复用共享卡片、品牌栏、分段控件与表单样式 */
body{display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth{width:100%;max-width:460px}
.auth-card{padding:30px}
.auth-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
.auth-head .brand{gap:11px}
.auth-head .brand-name{font-size:19px}
.auth-actions{display:flex;flex:none;align-items:center;gap:6px}
.auth-card .seg{margin-bottom:22px}
.auth-card .btn-block{margin-top:6px}
.pw{position:relative}
.pw .input{padding-right:52px}
.eye{position:absolute;top:50%;right:4px;display:flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;border:none;border-radius:50%;background:transparent;color:var(--txt3);font-size:17px;line-height:1;cursor:pointer;transform:translateY(-50%)}
.eye:hover{background:var(--tab)}
.rb{display:none;overflow:hidden;margin-top:16px;padding:12px 14px;border:1px solid var(--bd);border-radius:var(--r-md);background:var(--in);font-size:13.5px;font-weight:500}
.rb.show{display:block}
.rb.success{border-color:var(--ok-bd);background:var(--ok-bg)}
.rb.error{border-color:var(--err-bd);background:var(--err-bg)}
.tip{margin-top:20px;color:var(--txt3);font-size:12px;line-height:1.7;text-align:center}
.tip a{color:var(--ac-text);font-weight:600}
@media(max-width:600px){
  body{align-items:flex-start;padding:16px max(12px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-bottom))}
  .auth-card{padding:22px 18px}
  .auth-head{margin-bottom:20px}
  .auth-head .brand-name{font-size:17px}
  .eye{width:44px;height:44px;right:0}
  .tip{margin-top:16px;font-size:11px}
}
@media(max-width:380px){
  body{padding:10px}
  .auth-card{padding:20px 14px;border-radius:var(--r-md)}
  .auth-head .brand-sub{display:none}
}
@media(max-height:640px){body{align-items:flex-start;padding-top:max(16px,env(safe-area-inset-top))}}
</style>
</head>
<body>
<main class="card auth-card">
  <header class="auth-head">
    <a class="brand" href="/" aria-label="{{BRAND}} 首页">
      <img class="brand-avatar" src="/avatar.svg" alt="">
      <span class="brand-text">
        <span class="brand-name">{{BRAND}}</span>
        <span class="brand-sub">登录后保存历史 · 相同内容自动复用</span>
      </span>
    </a>
    <div class="auth-actions">
      <button class="icon-btn" id="tt" type="button" aria-label="切换深色模式"><span id="ti">🌙</span></button>
      <a class="icon-btn" href="/" title="返回首页" aria-label="返回首页">✕</a>
    </div>
  </header>

  <div class="seg" role="tablist" aria-label="登录或注册">
    <button class="tb active" data-tab="login" role="tab" aria-selected="true">登录</button>
    <button class="tb" data-tab="reg" role="tab" aria-selected="false">注册</button>
  </div>

  <div class="pn active" id="p-login">
    <div class="field"><label for="lu">用户名</label><input class="input" id="lu" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="请输入用户名"></div>
    <div class="field"><label for="lp">密码</label><div class="pw"><input class="input" id="lp" type="password" autocapitalize="off" spellcheck="false" autocomplete="current-password" placeholder="请输入密码"><button type="button" class="eye" data-for="lp" aria-label="显示密码">👁️</button></div></div>
    <p class="hint" style="margin-top:-8px;margin-bottom:14px;text-align:right"><a href="/recover">忘记密码？</a></p>
  </div>

  <div class="pn" id="p-reg">
    <div class="field"><label for="ru">用户名</label><input class="input" id="ru" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="3-32 位，中英文 / 数字 / _ / -"></div>
    <div class="field"><label for="rp">密码</label><div class="pw"><input class="input" id="rp" type="password" autocapitalize="off" spellcheck="false" autocomplete="new-password" placeholder="至少 6 位"><button type="button" class="eye" data-for="rp" aria-label="显示密码">👁️</button></div></div>
    <div class="field"><label for="rp2">确认密码</label><div class="pw"><input class="input" id="rp2" type="password" autocapitalize="off" spellcheck="false" autocomplete="new-password" placeholder="再次输入密码"><button type="button" class="eye" data-for="rp2" aria-label="显示密码">👁️</button></div></div>
  </div>

  <button class="btn btn-primary btn-block" id="go" type="button">登录</button>
  <div class="rb" id="res" role="status" aria-live="polite"><div class="ri"></div></div>
  <p class="tip">登录后可随时找回历史链接，避免重复生成<br><a href="/">← 返回首页继续免登录生成</a></p>
</main>
<script>
(function(){
var curTab="login";
var tabs=document.querySelectorAll(".tb");
var pns={login:document.getElementById("p-login"),reg:document.getElementById("p-reg")};
var go=document.getElementById("go");
for(var i=0;i<tabs.length;i++){tabs[i].addEventListener("click",function(){
  for(var j=0;j<tabs.length;j++){tabs[j].classList.remove("active");tabs[j].setAttribute("aria-selected","false")}
  this.classList.add("active");this.setAttribute("aria-selected","true");
  for(var k in pns)pns[k].classList.remove("active");
  curTab=this.getAttribute("data-tab");
  pns[curTab].classList.add("active");
  go.textContent=curTab==="login"?"登录":"注册并登录";
  document.getElementById("res").className="rb";
});}
function show(msg,ok){
  var rb=document.getElementById("res");rb.className="rb show "+(ok?"success":"error");
  rb.querySelector(".ri").innerHTML='<div class="'+(ok?"ok":"et")+'">'+esc(msg)+'</div>';
}
document.querySelectorAll(".eye").forEach(function(b){
  b.addEventListener("click",function(){
    var el=document.getElementById(b.getAttribute("data-for"));
    if(!el)return;
    var show=el.type==="password";
    el.type=show?"text":"password";
    b.textContent=show?"🙈":"👁️";
    b.setAttribute("aria-label",show?"隐藏密码":"显示密码");
  });
});
document.querySelector(".auth-card").addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target&&e.target.tagName==="INPUT"){e.preventDefault();go.click()}
});
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function post(url,data){
  return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)}).then(function(r){return r.json()});
}
go.addEventListener("click",async function(){
  var btn=go;var old=btn.textContent;btn.disabled=true;btn.textContent="请稍候...";
  try{
    if(curTab==="login"){
      var u=document.getElementById("lu").value.trim();
      var p=document.getElementById("lp").value;
      if(!u||!p){show("请输入用户名和密码",false);return}
      var d=await post("/api/login",{username:u,password:p});
      if(d.success){show("登录成功，正在跳转...",true);location.href="/my"}
      else show(d.error||"登录失败",false);
    }else{
      var u2=document.getElementById("ru").value.trim();
      var p2=document.getElementById("rp").value;
      var p3=document.getElementById("rp2").value;
      if(!u2||!p2){show("请输入用户名和密码",false);return}
      if(p2!==p3){show("两次输入的密码不一致",false);return}
      var d2=await post("/api/register",{username:u2,password:p2});
      if(d2.success){show("注册成功，正在跳转...",true);location.href="/my"}
      else show(d2.error||"注册失败",false);
    }
  }catch(e){show("网络错误，请重试",false)}
  finally{btn.disabled=false;btn.textContent=old}
});
fetch("/api/me").then(function(r){return r.json()}).then(function(d){
  if(d.success){show("已登录为 "+d.user.username+"，3 秒后前往我的页面...",true);setTimeout(function(){location.href="/my"},1500)}
}).catch(function(){});
})();
</script>
</body>
</html>

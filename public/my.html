<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0e" media="(prefers-color-scheme: dark)">
<meta name="preview-origin" content="{{PREVIEW_ORIGIN}}">
<title>我的页面 - {{BRAND}}</title>
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
/* 我的页面专属布局：与首页共用 theme.css 的顶栏、卡片与控件 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:15px 18px;border:1px solid var(--bd);border-radius:var(--r-lg);background:var(--card);box-shadow:var(--sh-sm);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.stat .v{font-size:22px;font-weight:700;letter-spacing:-.4px;line-height:1.25;background:var(--gr);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat .k{margin-top:2px;color:var(--txt3);font-size:12px}
.who{max-width:160px;overflow:hidden;color:var(--txt2);font-size:13px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
.list-card{padding:24px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.search-wrap{position:relative;flex:1;min-width:0}
.search-icon{position:absolute;top:50%;left:14px;color:var(--txt3);font-size:13px;line-height:1;pointer-events:none;transform:translateY(-50%)}
.search-input{padding-left:38px}
.count{flex:none;color:var(--txt3);font-size:12px;white-space:nowrap}
.filters{margin-bottom:2px}
.list{display:flex;flex-direction:column}
.item{padding:18px 2px}
.item + .item{border-top:1px solid var(--bd)}
.pname{margin-bottom:6px;font-size:16px;font-weight:700;line-height:1.35;word-break:break-word}
.pname.unnamed{color:var(--txt3);font-size:14px;font-weight:500}
.ih{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.code{padding:2px 8px;border-radius:7px;background:var(--info-bg);color:var(--ac-text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:600}
.meta{margin-top:6px;color:var(--txt3);font-size:12px;line-height:1.5}
.ib{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ib .act{font-weight:600}
.more{display:none;width:100%;margin-top:8px}
.list .empty{padding:44px 16px}
@media(max-width:600px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
  .stat{padding:12px 14px;border-radius:var(--r-md)}
  .stat .v{font-size:19px}
  .stat .k{font-size:11px}
  .who{display:none}
  .list-card{padding:18px}
  .toolbar{flex-wrap:wrap;gap:8px}
  .search-wrap{flex:1 1 100%}
  .count{margin-left:auto}
  .filters .fbtn{min-height:36px;padding:8px 4px}
  .item{padding:16px 0}
  .pname{font-size:15px}
  .ib{gap:6px;margin-top:10px}
  .ib .act{min-height:38px;padding:8px 11px;font-size:12px}
  .more{min-height:44px}
}
@media(max-width:380px){
  .stats{grid-template-columns:1fr}
  .ib .act{flex:1 1 calc(50% - 3px)}
}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <a class="brand" href="/" aria-label="{{BRAND}} 首页">
      <img class="brand-avatar" src="/avatar.svg" alt="">
      <span class="brand-text">
        <span class="brand-name">{{BRAND}}</span>
        <span class="brand-sub">我的页面</span>
      </span>
    </a>
    <div class="topbar-actions">
      <span class="who" id="who"></span>
      <a class="btn btn-primary btn-sm" href="/">＋ 新建</a>
      <button class="btn btn-ghost btn-sm" id="logout" type="button">退出</button>
      <button class="icon-btn" id="tt" type="button" aria-label="切换深色模式"><span id="ti">🌙</span></button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <section class="card list-card">
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input class="input search-input" id="q" placeholder="搜索名称 / code / 类型（按 / 聚焦）" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      </div>
      <span class="count" id="count"></span>
    </div>
    <div class="seg filters" id="filters" role="tablist" aria-label="按类型筛选">
      <button class="fbtn active" data-f="all" role="tab" aria-selected="true">全部</button>
      <button class="fbtn" data-f="code" role="tab" aria-selected="false">📝 代码</button>
      <button class="fbtn" data-f="url" role="tab" aria-selected="false">🔗 URL</button>
    </div>
    <div class="list" id="list"><div class="loading">加载中...</div></div>
    <button class="btn btn-ghost more" id="more" type="button">加载更多</button>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="modal-card">
    <div class="modal-title" id="mtitle">重命名页面</div>
    <input class="input" id="mname" maxlength="60" placeholder="给这个页面起个名字（留空则清除）" autocomplete="off" spellcheck="false">
    <div class="modal-actions">
      <button class="btn btn-ghost" id="mcancel" type="button">取消</button>
      <button class="btn btn-primary" id="msave" type="button">保存</button>
    </div>
  </div>
</div>

<div class="modal" id="delModal" role="dialog" aria-modal="true" aria-labelledby="dtitle" aria-describedby="ddesc">
  <div class="modal-card modal-danger">
    <div class="modal-icon" aria-hidden="true">🗑️</div>
    <div class="modal-title" id="dtitle">删除这个页面？</div>
    <p class="modal-desc" id="ddesc">确定要删除「<strong id="dname"></strong>」吗？</p>
    <p class="modal-warning">删除后预览链接将立即失效，且无法恢复。</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="dcancel" type="button">取消</button>
      <button class="btn btn-danger-solid" id="dconfirm" type="button">确认删除</button>
    </div>
  </div>
</div>

<script>
(function(){
function previewBase(){var m=document.querySelector('meta[name="preview-origin"]');return (m&&m.content)?m.content:location.origin}
var all=[], total=0, stats={count:0,bytes:0}, curFilter="all", loading=false, renameTarget=null, deleteTarget=null, deleteTrigger=null, deleting=false;

function toast(m){var t=document.getElementById("toast");t.textContent=m;t.className="toast show";setTimeout(function(){t.className="toast"},1800)}
function fmtSize(n){if(!n)return"0 B";if(n<1024)return n+" B";if(n<1048576)return (n/1024).toFixed(1)+" KB";return (n/1048576).toFixed(2)+" MB"}
function pad(n){return n<10?"0"+n:""+n}
function fmtDate(s){try{var d=new Date(s);if(isNaN(d))return s;return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes())}catch(e){return s}}
function copyText(txt,btn){
  var done=function(){var o=btn.textContent;btn.textContent="已复制";setTimeout(function(){btn.textContent=o},1500)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(fallback)}else{fallback()}
  function fallback(){var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){}document.body.removeChild(ta)}
}
function loadStats(){
  document.getElementById("stats").innerHTML=
    '<div class="stat"><div class="v">'+stats.count+'</div><div class="k">生成的页面</div></div>'+
    '<div class="stat"><div class="v">'+fmtSize(stats.bytes)+'</div><div class="k">占用空间（去重后）</div></div>';
}
function updateMore(){
  var b=document.getElementById("more");
  b.style.display=all.length<total?"inline-flex":"none";
  b.textContent="加载更多（已显示 "+all.length+" / "+total+"）";
}
function render(){
  var q=(document.getElementById("q").value||"").trim().toLowerCase();
  var items=all.filter(function(x){
    if(curFilter!=="all"&&x.type!==curFilter)return false;
    if(!q)return true;
    return (x.name||"").toLowerCase().indexOf(q)>=0||x.code.toLowerCase().indexOf(q)>=0||(x.type||"").toLowerCase().indexOf(q)>=0;
  });
  document.getElementById("count").textContent=q||curFilter!=="all"?"匹配 "+items.length+" / 共 "+total+" 条":"共 "+total+" 条";
  var list=document.getElementById("list");
  list.innerHTML="";
  if(!items.length){
    if(total===0){
      list.innerHTML='<div class="empty">还没有生成过页面<br><a href="/">去生成第一个 →</a></div>';
    }else{
      list.innerHTML='<div class="empty">没有匹配的记录<br><button class="btn btn-ghost btn-sm" id="clear" type="button">清除筛选</button></div>';
      var c=document.getElementById("clear");
      if(c)c.addEventListener("click",function(){document.getElementById("q").value="";curFilter="all";document.querySelectorAll(".fbtn").forEach(function(b){b.classList.toggle("active",b.dataset.f==="all");b.setAttribute("aria-selected",b.dataset.f==="all"?"true":"false")});render()});
    }
    return;
  }
  items.forEach(function(x){
    var el=document.createElement("div");el.className="item";
    var nmEl=document.createElement("div");nmEl.className="pname"+(x.name?"":" unnamed");nmEl.textContent=x.name||"未命名页面";
    var ih=document.createElement("div");ih.className="ih";
    var code=document.createElement("span");code.className="code";code.textContent=x.code;
    var badge=document.createElement("span");badge.className="badge";badge.textContent=x.type==="url"?"🔗 URL":"📝 代码";
    ih.appendChild(code);ih.appendChild(badge);
    var meta=document.createElement("div");meta.className="meta";
    meta.textContent=fmtSize(x.size)+" · 创建于 "+fmtDate(x.createdAt)+(x.updatedAt&&x.updatedAt!==x.createdAt?" · 更新于 "+fmtDate(x.updatedAt):"");
    var ib=document.createElement("div");ib.className="ib";
    var pv=document.createElement("a");pv.className="btn btn-ghost btn-sm act";pv.href=previewBase()+"/p/"+encodeURIComponent(x.code);pv.target="_blank";pv.rel="noopener";pv.textContent="🔍 预览";
    var ed=document.createElement("a");ed.className="btn btn-ghost btn-sm act";ed.href="/edit/"+encodeURIComponent(x.code)+"#key="+encodeURIComponent(x.editKey);ed.target="_blank";ed.rel="noopener";ed.textContent="✏️ 编辑";
    var rn=document.createElement("button");rn.className="btn btn-ghost btn-sm act";rn.type="button";rn.textContent="🏷️ 重命名";rn.onclick=function(){openRename(x)};
    var cp=document.createElement("button");cp.className="btn btn-ghost btn-sm act";cp.type="button";cp.textContent="📋 复制链接";cp.onclick=function(){copyText(previewBase()+"/p/"+x.code,cp)};
    var dl=document.createElement("button");dl.className="btn btn-danger btn-sm act";dl.type="button";dl.textContent="🗑 删除";dl.onclick=function(){openDelete(x,dl)};
    ib.appendChild(pv);ib.appendChild(ed);ib.appendChild(rn);ib.appendChild(cp);ib.appendChild(dl);
    el.appendChild(nmEl);el.appendChild(ih);el.appendChild(meta);el.appendChild(ib);
    list.appendChild(el);
  });
}
function openRename(x){
  renameTarget=x;
  var m=document.getElementById("modal"),inp=document.getElementById("mname");
  document.getElementById("mtitle").textContent="重命名 "+x.code;
  inp.value=x.name||"";
  m.classList.add("show");
  document.body.style.overflow="hidden";
  setTimeout(function(){inp.focus();inp.select()},50);
}
function closeRename(){document.getElementById("modal").classList.remove("show");document.body.style.overflow="";renameTarget=null}
function saveRename(){
  if(!renameTarget)return;
  var btn=document.getElementById("msave");btn.disabled=true;btn.textContent="保存中...";
  fetch("/api/rename",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:renameTarget.code,name:document.getElementById("mname").value.trim()})})
    .then(function(r){return r.json()}).then(function(d){
      if(d.success){renameTarget.name=d.name||"";toast(d.name?"已重命名":"已清除名称");closeRename();render()}
      else toast(d.error||"重命名失败");
    }).catch(function(){toast("网络错误")}).finally(function(){btn.disabled=false;btn.textContent="保存"});
}
function openDelete(x,btn){
  deleteTarget=x;deleteTrigger=btn||null;deleting=false;
  var yes=document.getElementById("dconfirm"),no=document.getElementById("dcancel");
  yes.disabled=false;no.disabled=false;yes.textContent="确认删除";
  document.getElementById("dname").textContent=x.name?x.name+"（"+x.code+"）":x.code;
  document.getElementById("delModal").classList.add("show");
  document.body.style.overflow="hidden";
  setTimeout(function(){no.focus()},50);
}
function closeDelete(force){
  if(deleting&&!force)return;
  document.getElementById("delModal").classList.remove("show");
  document.body.style.overflow="";
  deleteTarget=null;
  var trigger=deleteTrigger;
  var yes=document.getElementById("dconfirm"),no=document.getElementById("dcancel");
  yes.disabled=false;no.disabled=false;yes.textContent="确认删除";
  deleteTrigger=null;deleting=false;
  if(trigger&&trigger.focus){try{trigger.focus()}catch(e){}}
}
function confirmDelete(){
  if(!deleteTarget||deleting)return;
  var x=deleteTarget;
  var yes=document.getElementById("dconfirm"),no=document.getElementById("dcancel");
  deleting=true;yes.disabled=true;no.disabled=true;yes.textContent="删除中...";
  function fail(msg){
    deleting=false;yes.disabled=false;no.disabled=false;yes.textContent="确认删除";toast(msg);
  }
  fetch("/api/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:x.code})})
    .then(function(r){return r.json()}).then(function(d){
      if(d.success){
        all=all.filter(function(y){return y.code!==x.code});
        total=Math.max(0,total-1);stats.count=Math.max(0,stats.count-1);stats.bytes=Math.max(0,stats.bytes-(x.size||0));
        closeDelete(true);toast("已删除");loadStats();render();updateMore();
      }else{fail(d.error||"删除失败")}
    }).catch(function(){fail("网络错误")});
}
function load(reset){
  if(loading)return;
  loading=true;
  var offset=reset?0:all.length;
  fetch("/api/my?offset="+offset+"&limit=50").then(function(r){return r.json()}).then(function(m){
    if(!m.success){location.href="/login";return}
    total=m.total||0;stats=m.stats||{count:0,bytes:0};
    all=reset?m.items||[]:all.concat(m.items||[]);
    loadStats();render();updateMore();
  }).catch(function(){toast("加载失败，请刷新重试")}).finally(function(){loading=false});
}
var searchTimer;
document.getElementById("q").addEventListener("input",function(){clearTimeout(searchTimer);searchTimer=setTimeout(render,120)});
document.querySelectorAll(".fbtn").forEach(function(b){
  b.addEventListener("click",function(){
    curFilter=b.dataset.f;
    document.querySelectorAll(".fbtn").forEach(function(x){x.classList.toggle("active",x===b);x.setAttribute("aria-selected",x===b?"true":"false")});
    render();
  });
});
document.getElementById("more").addEventListener("click",function(){load(false)});
document.getElementById("mcancel").addEventListener("click",closeRename);
document.getElementById("msave").addEventListener("click",saveRename);
document.getElementById("modal").addEventListener("click",function(e){if(e.target===this)closeRename()});
document.getElementById("dcancel").addEventListener("click",function(){closeDelete()});
document.getElementById("dconfirm").addEventListener("click",confirmDelete);
document.getElementById("delModal").addEventListener("click",function(e){if(e.target===this)closeDelete()});
document.getElementById("mname").addEventListener("keydown",function(e){
  if(e.key==="Enter"){e.preventDefault();saveRename()}
  if(e.key==="Escape"){e.preventDefault();closeRename()}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){
    if(document.getElementById("delModal").classList.contains("show")){e.preventDefault();closeDelete();return}
    if(document.getElementById("modal").classList.contains("show")){e.preventDefault();closeRename();return}
  }
  if(e.key==="/"&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA"){e.preventDefault();document.getElementById("q").focus()}
});
document.getElementById("logout").addEventListener("click",function(){
  fetch("/api/logout",{method:"POST"}).then(function(){location.href="/"}).catch(function(){location.href="/"});
});
fetch("/api/me").then(function(r){return r.json()}).then(function(d){
  if(!d.success){location.href="/login";return}
  document.getElementById("who").textContent="👤 "+d.user.username;
  load(true);
}).catch(function(){location.href="/login"});
})();
</script>
</body>
</html>
